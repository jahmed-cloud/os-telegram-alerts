[secure]
command:/usr/local/opnsense/scripts/OPNsense/TelegramAlerts/secure.sh
parameters:
type:script_output
message:securing telegram alerts settings

[test]
command:/usr/local/opnsense/scripts/OPNsense/TelegramAlerts/test.sh
parameters:
type:script_output
message:sending telegram test message

[daily]
command:/usr/local/opnsense/scripts/OPNsense/TelegramAlerts/daily.sh
parameters:
type:script_output
message:sending telegram daily summary
description:Telegram Alerts daily summary

[backup]
command:/usr/local/opnsense/scripts/OPNsense/TelegramAlerts/backup.sh --force
parameters:
type:script_output
message:sending encrypted config backup to telegram
description:Telegram Alerts encrypted config backup

[dashboard]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/TelegramAlerts/dashboard.php
parameters:
type:script_output
message:telegram alerts dashboard data
